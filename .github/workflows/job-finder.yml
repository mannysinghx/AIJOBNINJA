name: Job Finder

# Tests for the self-contained module under modules/job-finder: its Python
# tools and guards, and the web UI's Bun tests. Portal CLIs are not called
# live here; their suites use checked-in fixtures.

on:
  pull_request:
    branches: [main]
    paths: ['modules/job-finder/**', '.github/workflows/job-finder.yml']
  push:
    branches: [main]
    paths: ['modules/job-finder/**', '.github/workflows/job-finder.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modules/job-finder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Python tests and guards
        run: |
          python3 -m unittest discover -s tests
          python3 tools/security_guards.py
      - name: Web UI tests
        working-directory: modules/job-finder/webui
        run: bun test
