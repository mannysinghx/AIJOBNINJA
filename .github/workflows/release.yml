name: Release Please
on:
  push:
    branches: [main]
  # Manual re-publish: when a release was tagged but the npm publish failed,
  # dispatch this workflow to publish the scaffolder at its current version
  # without cutting a new release.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    # Off until the repository opts in, so pushes do not produce failing runs.
    # To turn releases on:
    #   1. Settings -> Actions -> General -> Workflow permissions: tick
    #      "Allow GitHub Actions to create and approve pull requests"
    #      (release-please opens its release PR with GITHUB_TOKEN).
    #   2. Settings -> Secrets and variables -> Actions -> Variables: add
    #      RELEASE_PLEASE = enabled.
    if: ${{ vars.RELEASE_PLEASE == 'enabled' }}
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN, not an App token: no extra secrets to manage. Releases
      # created with GITHUB_TOKEN do not trigger other workflows, and the
      # release PR it opens does not start CI on its own; run the checks on
      # that PR manually (or push to its branch) before merging.
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publish the npm scaffolder when a aijobninja release was just created,
      # OR on a manual dispatch (to recover from a failed publish), but only
      # when the repository also sets NPM_PUBLISH = enabled and a trusted
      # publisher for the package is configured on npmjs.com. The checkout
      # also runs when only the `web` component was released: the Latest step
      # at the bottom reads the manifest from it.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v7
        if: ${{ vars.NPM_PUBLISH == 'enabled' && (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing (OIDC): npm >= 11.5.1 authenticates via the workflow's
      # id-token against the trusted publisher configured on npmjs.com — no token.
      # setup-node ships an older npm, so upgrade before publishing.
      - name: Upgrade npm for trusted publishing
        if: ${{ vars.NPM_PUBLISH == 'enabled' && (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') }}
        run: npm install -g npm@latest
      - name: Publish scaffolder to npm
        if: ${{ vars.NPM_PUBLISH == 'enabled' && (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') }}
        run: npm publish --provenance --access public
        working-directory: scaffolder

      # GitHub marks whichever release was created LAST as "Latest", and in this
      # manifest the `web` component is created after `aijobninja`, so without
      # this step the releases page would point at `web-vX.Y.Z` instead of the
      # main package.
      #
      # Re-assert it explicitly so ordering stops deciding. Reads the version
      # from the manifest rather than an action output, so it cannot drift from
      # what was actually released.
      #
      # `releases_created` is the string 'true'/'false' (release_created is
      # unset when false, so the bare form works for it and not for this one).
      #
      # Runs on ANY release, not only a aijobninja one: a web-only release
      # would otherwise become Latest, and update-system.mjs resolves what to
      # install from /releases/latest — it refuses a web-* tag, so every
      # install would stop getting updates until the next aijobninja release.
      - name: Keep the aijobninja release marked as Latest
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(jq -r '."."' .release-please-manifest.json)
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then
            echo "::error::could not read the aijobninja version from .release-please-manifest.json"
            exit 1
          fi
          echo "marking aijobninja-v${ver} as Latest"
          gh release edit "aijobninja-v${ver}" --repo "$GITHUB_REPOSITORY" --latest
