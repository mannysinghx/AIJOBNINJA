<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIJobNinja · App</title>
  <meta name="description" content="Search jobs, track applications, and get AI fit evaluations, tailored CVs and cover letters. Your data stays in your browser.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/app.css">
  <script type="module" src="/app/js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="AIJobNinja home">
        <img src="/logo.svg" alt="" width="30" height="30">
        <span class="brand-text">AIJob<b>Ninja</b></span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#/search" data-route="search">Search</a>
        <a href="#/tracker" data-route="tracker">Tracker <span class="pill" id="trackedCount">0</span></a>
        <a href="#/profile" data-route="profile">Profile</a>
        <a href="#/settings" data-route="settings">AI settings</a>
      </nav>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>

  <div class="drawer-backdrop" id="backdrop" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">AIJobNinja needs JavaScript to run in your browser.</p></noscript>
</body>
</html>
